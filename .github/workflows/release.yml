name: Release Universal Plugin

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build and Publish Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'maven'

      - name: Build Universal Shaded JAR with Maven
        run: mvn clean package --no-transfer-progress

      - name: Locate Compiled Release Artifact
        id: locate_jar
        run: |
          JAR_PATH=$(find target -maxdepth 1 -name "Sentinel-Minecraft-*.jar" ! -name "original-*" | head -n 1)
          if [ -z "$JAR_PATH" ]; then
            JAR_PATH=$(find target -name "Sentinel-Minecraft-*.jar" ! -name "original-*" | head -n 1)
          fi
          echo "Found release binary: $JAR_PATH"
          echo "jar_path=$JAR_PATH" >> $GITHUB_OUTPUT

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ steps.locate_jar.outputs.jar_path }}
          name: "Sentinel Minecraft ${{ github.ref_name }}"
          generate_release_notes: false
          body: |
            ## Sentinel Minecraft Connector ${{ github.ref_name }}

            Official universal Kotlin plugin connecting Minecraft networks to the Sentinel Edge Intelligence Network ([antivpn.tech](https://antivpn.tech)).

            ### Supported Platforms
            - Velocity 3.3+
            - BungeeCord / Waterfall
            - Paper / Purpur / Spigot / Bukkit 1.8 – 1.21+

            ### Key Capabilities
            - **Sentinel Gate**: In-memory join velocity limiter and anti-bot flood shield.
            - **Active Blocking by Default**: Mode defaults to `ENFORCE` upon installation.
            - **Fail-Open Architecture**: Sub-5ms async queries; players are never disconnected during network drops.
            - **Gaming Optimizer Bypass**: Preserves ExitLag, WTFast, and ping routing software.
            - **Rate-Limited Discord Telemetry**: Consolidated alert digest during high-volume bot raids.
            - **Zero Dependencies**: Kotlin standard library is fully shaded and isolated.

            ### Installation
            1. Download `Sentinel-Minecraft-${{ github.ref_name }}.jar` below.
            2. Place into your server or proxy `/plugins/` directory.
            3. Claim your license key at [antivpn.tech](https://antivpn.tech) and add it to `config.yml`.
            4. Execute `/sentinel reload`.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
